name: Update courses and publish site

on:
  schedule:
    - cron: "17 10 * * 1"   # every Monday, 10:17 UTC (early morning in New York)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["docs/**", "scraper/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether gc.cuny.edu is reachable from GitHub
        continue-on-error: true
        run: |
          for u in https://www.gc.cuny.edu/english/curriculum-and-degree-information/courses https://www.gc.cuny.edu/ https://qualitativeconcentration.commons.gc.cuny.edu/ ; do
            echo "$(curl -s -o /tmp/p.html -w '%{http_code}' -A 'Mozilla/5.0' "$u") $u :: $(grep -o '<title>[^<]*' /tmp/p.html | head -1)"
          done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scrape program pages
        run: node scraper/scrape.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data debug
          git diff --cached --quiet || git commit -m "Weekly course update $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
